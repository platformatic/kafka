name: Publish release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'The version number to tag and release'
        required: true
        type: string
      prerelease:
        description: 'Release as pre-release'
        required: false
        type: boolean
        default: false
jobs:
  release-npm:
    runs-on: ubuntu-latest
    environment: main
    permissions:
      actions: read
      id-token: write
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Require successful regression
        id: regression
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          runs=$(gh api --method GET \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/regression.yml/runs" \
            -f branch="$GITHUB_REF_NAME" \
            -f head_sha="$GITHUB_SHA" \
            -f per_page=100)
          run=$(printf '%s' "$runs" | jq -c '.workflow_runs | sort_by(.created_at) | last // empty')

          if [ -z "$run" ]; then
            printf 'No regression run found for %s.\n' "$GITHUB_SHA" >&2
            exit 1
          fi

          run_id=$(printf '%s' "$run" | jq -r '.id')
          status=$(printf '%s' "$run" | jq -r '.status')
          conclusion=$(printf '%s' "$run" | jq -r '.conclusion')
          run_url=$(printf '%s' "$run" | jq -r '.html_url')

          if [ "$status" != 'completed' ] || [ "$conclusion" != 'success' ]; then
            printf 'Regression run %s is not clean: status=%s, conclusion=%s\n%s\n' \
              "$run_id" "$status" "$conclusion" "$run_url" >&2
            exit 1
          fi

          mkdir -p release-artifacts
          gh run download "$run_id" \
            --repo "$GITHUB_REPOSITORY" \
            --name "regression-artifacts-${run_id}" \
            --dir release-artifacts

          if [ ! -s release-artifacts/regression-summary.md ]; then
            printf 'Regression run %s has no regression-summary.md artifact.\n' "$run_id" >&2
            exit 1
          fi

          printf 'run-id=%s\n' "$run_id" >> "$GITHUB_OUTPUT"
          printf 'run-url=%s\n' "$run_url" >> "$GITHUB_OUTPUT"
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest
      - name: Use supported Node.js Version
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
      - name: Restore cached dependencies
        uses: actions/cache@v3
        with:
          path: ~/.pnpm-store
          key: node-modules-${{ hashFiles('package.json') }}
      - name: Install dependencies
        run: pnpm install
      - name: Bump Version
        run: node scripts/bump-version.ts "${{ inputs.version }}" "${{ github.actor }}"
        env:
          GITHUB_ACTIONS: 'true'
      - name: Push changes
        run: git push origin HEAD:${{ github.ref }}
      - name: Update npm
        run: npm install -g npm@11.16.0
      - name: Stage release on NPM
        run: pnpm stage publish --access public --tag ${{ inputs.prerelease == true && 'next' || 'latest' }} --provenance --publish-branch ${{ github.ref_name }} --no-git-checks
      - name: Create draft release notes
        run: |
          pnpx @matteo.collina/release-notes -a ${{ secrets.GH_RELEASE_TOKEN }} -t v${{ inputs.version }} -r kafka -o platformatic -d ${{ github.event.inputs.prerelease == 'true' && '-p' || '' }} -c ${{ github.ref }}
      - name: Attach regression summary
        env:
          GH_TOKEN: ${{ secrets.GH_RELEASE_TOKEN }}
        run: |
          gh release upload "v${{ inputs.version }}" release-artifacts/regression-summary.md
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GH_RELEASE_TOKEN }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          if [ "$PRERELEASE" = 'true' ]; then
            gh release edit "v${{ inputs.version }}" --draft=false
          else
            gh release edit "v${{ inputs.version }}" --draft=false --latest
          fi
