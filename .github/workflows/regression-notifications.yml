---
name: Regression Notifications

on:
  workflow_run:
    workflows:
      - Regression Tests
    branches:
      - main
    types:
      - requested
      - completed

permissions:
  actions: read
  contents: read

concurrency:
  group: regression-notification-${{ github.event.workflow_run.id }}
  # A completion event supersedes the queue watchdog for the same regression run.
  cancel-in-progress: true

jobs:
  queue-timeout:
    name: Check regression queue time
    if: github.event.action == 'requested'
    runs-on: ubuntu-latest
    timeout-minutes: 130
    steps:
      - name: Wait for runner assignment
        run: sleep 7200

      - name: Check regression status
        id: status
        env:
          GH_TOKEN: ${{ github.token }}
          REGRESSION_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          status=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${REGRESSION_RUN_ID}" --jq '.status')

          if [ "$status" != 'queued' ]; then
            exit 0
          fi

          active_runs=$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/regression.yml/runs?branch=main&status=in_progress&per_page=1" \
            --jq '.total_count')

          # An active regression means the dedicated runner is available but intentionally busy.
          if [ "$active_runs" -gt 0 ]; then
            exit 0
          fi

          printf 'notify=true\n' >> "$GITHUB_OUTPUT"

      - name: Notify Slack about unavailable runner
        if: steps.status.outputs.notify == 'true'
        env:
          REGRESSION_SLACK_WEBHOOK_URL: ${{ secrets.REGRESSION_SLACK_WEBHOOK_URL }}
          REGRESSION_RUN_URL: ${{ github.event.workflow_run.html_url }}
          REGRESSION_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          message=$(printf \
            'Kafka regression has not picked up a runner after 2 hours.\nRepository: %s\nCommit: %.12s\nRun: %s' \
            "$GITHUB_REPOSITORY" "$REGRESSION_HEAD_SHA" "$REGRESSION_RUN_URL")
          jq -n --arg text "$message" '{ text: $text }' | \
            curl --fail-with-body --retry 3 \
              --header 'content-type: application/json' \
              --data-binary @- \
              "$REGRESSION_SLACK_WEBHOOK_URL"

  regression-failure:
    name: Report regression failure
    if: >-
      github.event.action == 'completed' &&
      contains(fromJSON('["failure", "timed_out", "startup_failure", "stale", "action_required", "cancelled"]'),
      github.event.workflow_run.conclusion)
    runs-on: ubuntu-latest
    steps:
      - name: Notify Slack about regression failure
        env:
          REGRESSION_SLACK_WEBHOOK_URL: ${{ secrets.REGRESSION_SLACK_WEBHOOK_URL }}
          REGRESSION_RUN_URL: ${{ github.event.workflow_run.html_url }}
          REGRESSION_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          REGRESSION_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          message=$(printf \
            'Kafka regression completed with status %s.\nRepository: %s\nCommit: %.12s\nRun: %s' \
            "$REGRESSION_CONCLUSION" "$GITHUB_REPOSITORY" "$REGRESSION_HEAD_SHA" "$REGRESSION_RUN_URL")
          jq -n --arg text "$message" '{ text: $text }' | \
            curl --fail-with-body --retry 3 \
              --header 'content-type: application/json' \
              --data-binary @- \
              "$REGRESSION_SLACK_WEBHOOK_URL"
