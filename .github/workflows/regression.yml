---
name: Regression Tests

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: kafka-regression-linux
  cancel-in-progress: false

jobs:
  modern-regression:
    name: Regression / Confluent Kafka ${{ matrix.kafka-version }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        kafka-version: [7.5.0, 7.6.0, 7.7.0, 7.8.0, 7.9.0, 8.0.0, 8.1.0, 8.2.0]
    runs-on: [self-hosted, kafka-regression]
    environment: regression
    timeout-minutes: 180
    env:
      KAFKA_VERSION: ${{ matrix.kafka-version }}
      REGRESSION_LANE: linux-kafka-${{ matrix.kafka-version }}-node-24
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Use supported Node.js Version
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.x

      - name: Setup pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
        with:
          version: 11.1.0

      - name: Restore cached dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.pnpm-store
          key: node-modules-${{ hashFiles('package.json', 'pnpm-lock.yaml') }}

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y krb5-user

      - name: Install NPM Dependencies
        run: pnpm install --frozen-lockfile

      - name: Clean up previous Kafka Cluster
        run: docker compose down --volumes --remove-orphans

      - name: Start Kafka Cluster
        run: docker compose up --build --force-recreate -d --wait

      - name: Verify Kafka Cluster Readiness
        run: |
          for attempt in {1..30}; do
            if docker compose exec -T broker-cluster-1 kafka-broker-api-versions --bootstrap-server localhost:19092 >/dev/null 2>&1 && \
              docker compose exec -T broker-cluster-2 kafka-broker-api-versions --bootstrap-server localhost:19092 >/dev/null 2>&1 && \
              docker compose exec -T broker-cluster-3 kafka-broker-api-versions --bootstrap-server localhost:19092 >/dev/null 2>&1; then
              exit 0
            fi

            sleep 2
          done

          echo 'Kafka cluster did not become ready in time.'
          docker compose ps
           docker compose logs --no-color
           exit 1

      - name: Build
        run: pnpm run build

      - name: Run modern regression suites
        run: bash ./scripts/run-regression-suite.sh modern "$KAFKA_VERSION" "$REGRESSION_LANE"

      - name: Upload regression artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: regression-artifacts-modern-${{ matrix.kafka-version }}
          path: regression/artifacts
          if-no-files-found: ignore

      - name: Dump Kafka diagnostics
        if: failure()
        run: |
          docker compose ps
          docker compose logs --no-color

      - name: Stop Kafka Cluster
        if: always()
        run: docker compose down --volumes

  legacy-regression:
    name: Regression / Apache Kafka 1.1.0
    needs: modern-regression
    if: ${{ always() }}
    runs-on: [self-hosted, kafka-regression]
    environment: regression
    timeout-minutes: 180
    env:
      KAFKA_VERSION: 1.1.0
      REGRESSION_LANE: linux-kafka-1.1-node-24
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Use supported Node.js Version
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.x
      - name: Setup pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
        with:
          version: 11.1.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Clean up Kafka clusters
        run: docker compose -f docker-compose.legacy.yml down --volumes --remove-orphans
      - name: Run legacy regression suites
        run: bash ./scripts/run-regression-suite.sh legacy "$KAFKA_VERSION" "$REGRESSION_LANE"
      - name: Upload legacy regression artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: regression-artifacts-legacy
          path: regression/artifacts
          if-no-files-found: ignore

  report:
    name: Report regression results
    needs: [modern-regression, legacy-regression]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Download regression artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: regression-artifacts-*
          path: regression/artifacts
          merge-multiple: true
      - name: Create aggregate regression summary
        env:
          MODERN_RESULT: ${{ needs.modern-regression.result }}
          LEGACY_RESULT: ${{ needs.legacy-regression.result }}
        run: |
          summary=regression/artifacts/regression-summary.md
          mkdir -p regression/artifacts
          {
            printf '# Regression test summary\n\n'
            printf -- '- Commit: [`%s`](%s)\n' "$GITHUB_SHA" "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}"
            printf -- '- Workflow run: [#%s](%s)\n\n' "$GITHUB_RUN_NUMBER" "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            printf '## Modern Kafka versions\n\n'
            printf -- '- Matrix result: `%s`\n\n' "$MODERN_RESULT"
            for version in 7.5.0 7.6.0 7.7.0 7.8.0 7.9.0 8.0.0 8.1.0 8.2.0; do
              report="regression/artifacts/linux-kafka-${version}-node-24-report.md"
              if [ -f "$report" ]; then
                cat "$report"
              else
                printf '### Kafka %s\n\n- Result: no lane report was produced.\n' "$version"
              fi
              printf '\n'
            done
            printf '\n## Legacy Sanity Check\n\n'
            printf -- '- Job result: `%s`\n\n' "$LEGACY_RESULT"
            if [ -f regression/artifacts/linux-kafka-1.1-node-24-report.md ]; then
              cat regression/artifacts/linux-kafka-1.1-node-24-report.md
            else
              printf 'Legacy lane report was not produced.\n'
            fi
          } > "$summary"
          cp "$summary" "$GITHUB_STEP_SUMMARY"
      - name: Upload aggregate regression report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: regression-artifacts-${{ github.run_id }}
          path: regression/artifacts
          if-no-files-found: ignore
      - name: Notify regression failure on Slack
        if: ${{ needs.modern-regression.result == 'failure' || needs.legacy-regression.result == 'failure' }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          REGRESSION_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REGRESSION_HEAD_SHA: ${{ github.sha }}
        run: |
          message=$(printf \
            'Kafka regression tests failed.\nRepository: %s\nCommit: %.12s\nRun: %s' \
            "$GITHUB_REPOSITORY" "$REGRESSION_HEAD_SHA" "$REGRESSION_RUN_URL")
          jq -n --arg text "$message" '{ text: $text }' | \
            curl --fail-with-body --retry 3 \
              --header 'content-type: application/json' \
              --data-binary @- \
              "$SLACK_WEBHOOK_URL"
      - name: Fail aggregate job when a lane failed
        if: ${{ needs.modern-regression.result == 'failure' || needs.legacy-regression.result == 'failure' }}
        run: exit 1
